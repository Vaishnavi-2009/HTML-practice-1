<!DOCTYPE html>
<html lang="en">
<head>
    <style>
        .card {
            width: 300px;
            padding: 20px;
            background-color: white;
            border: 2px solid rgb(236, 42, 42);
            border-radius: 10px;
            background-color: rgb(244, 204, 229);
            text-align: center;
        }

        .card h2 {
            color: rgb(255, 0, 0);
            text-align: center;
        }

        .card p {
            color: rgb(221, 74, 11);
            font-size: 16px;
            text-align: center;
        }
    </style>
</head>
<body>
    <div class="card">
        <h1>ANNIVERSARY GREETING</h1>
        <h2>8th May 2026</h2>
        <p>Happy anniversary!</p>
    </div>
</body>
</html>
