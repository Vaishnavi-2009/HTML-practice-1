<!DOCTYPE html>
<html lang="en">
<head>
    <style>
        .card {
            width: 300px;
            padding: 20px;
            border: 2px solid rgb(47, 7, 245);
            border-radius: 10px;
            background-color: rgb(255, 255, 255);
            text-align: center;
        }

        .card h1 {
            color: rgb(17, 0, 255);
            text-align: center;
        }

        .card p {
            color: rgb(229, 109, 109);
            font-size: 16px;
            text-align: center;
        }
        .card button {
            background-color: rgb(47, 7, 245);
            color: rgb(255, 255, 255);
            padding: 10px 20px;
            border: none;
            font-size: 16px;
            }
    </style>
</head>
<body>
    <div class="card">
        <h1>JavaScript</h1>
        <p>Learn JavaScript and make your webpages interactive.</p>
        <button>Start Course</button>
    </div>
</body>
</html>
