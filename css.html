<!DOCTYPE html>
<html lang="en">
<head>
    <style>
        h1 {
            background-color: rgb(0, 255, 191);
            text-align: center;
            text-decoration: overline;
            text-transform: uppercase;
            font-family: 'Courier New', Courier, monospace;
            border: 3px dotted rgb(0, 0, 0);
        }
        h2{
            background-color: #ffdd00;
            text-align: right;
            text-decoration: line-through;
            text-align: center;
            border-style : dashed;
        }
        h3{
            background-color: hsl(308, 89%, 58%);
            font-size: 30px;
            font-style: italic;
            border-width: 5px;
            border-style: double;
            border-radius: 10px;
        }
        h4{
            text-align: center;
            text-decoration: underline;
            font-family: 'Courier New', Courier, monospace;
        }
        .intro{
            color: rgb(255, 0, 0);
            font-size: 20px;
            font-family: 'Courier New', Courier, monospace;
            font-weight: bold;
        }
        .hope{
            color: rgb(0, 0, 255);
            font-size: 18px;
            font-family: 'Courier New', Courier, monospace;
            font-weight: bold;
            text-align: center;
        }
        .description{
            color: rgb(0, 128, 0);
            font-size: 16px;
            font-family: 'Courier New', Courier, monospace;
            font-weight: bold;
            text-align: right;
        }
    </style>
</head>
<body>
    <h1>Hello, GUYZZ</h1>
    <p class="intro">Welcome to my Website</p>
    <p class="hope">Hope you like it</p>
    <p class="description">This is a simple description of my website.</p>
    <h2>WASSUPPP!!!!!?</h2>
    <h3>Myself Vaishnavi Tiwari</h3>
    <h4>I love Dancing.</h4>
</body>
</html>
