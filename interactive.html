<!DOCTYPE html>
<html lang="en">
<head>
    <title>JavaScript Syntax Example</title>
</head>
<body>
    <h1>JavaScript Syntax Example</h1>
    <script>
        console.log("Hello, World!");
        console.log("Vaishnavi Tiwari");
        let age = 20;
        console.log("Age:", age);
        age = 21;
        console.log("Updated Age:", age);
        let student = {
            name: "Vaishnavi Tiwari",
            age: 17,
            Course: "B.Tech-CSE",
        };
        console.log("Student:", student);
        let fruits = ["Apple", "Banana", "Mango"];
        console.log("Fruits:", fruits);
        console.log("First Fruit:", fruits[0]);
        console.log("Second Fruit:", fruits[1]);
        console.log("Third Fruit:", fruits[2]);
        //operators
        let a = 10;
        console.log("a==10:", a==10);
        console.log("a!=10:", a!=10);
        console.log("a>10:", a>10);
        console.log("a<10:", a<10);
        console.log("a>=10:", a>=10);
        console.log("a<=10:", a<=10);
        console.log("a===10:", a===10);//to check if they have the same value and type
        console.log("a!==10:", a!==10);//to check if they have the same value and type

        //logical operators
        let marks = 80;
        console.log(
            "AND:", marks > 50 && marks < 100
        );
        console.log(
            "OR:", marks > 50 || marks < 100
        );
        let passed = true;
        console.log(
            "NOT:", !passed
        );
        console.log(5 =="5");
        console.log(5 ==="5");
    </script>

</body>
</html>
