<!-- Defination:
 HTML headings are used to create headings or titles on a webpage.
 HTML provides 6 heading tags: </h1. to </h6>
 <h1> is the biggest and most important heading.
    <h6> is the smallest heading.
-->

<h1>My Website</h1>

<!-- Example:
 <h1> = Opening heading tag
    My website = Heading text
    </h1> = Closing heading tag

    The <h1> tag is used to create the main heading of a webpage.
-->
